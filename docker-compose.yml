services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alertmanager
      POSTGRES_USER: alertmanager
      POSTGRES_PASSWORD: alertmanager
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertmanager -d alertmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      ALERT_MANAGER_DATABASE_URL: postgresql://alertmanager:alertmanager@postgres:5432/alertmanager
    ports:
      - "8000:8000"
      - "7754:7754"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
