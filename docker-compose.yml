services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alertmanager}
      POSTGRES_USER: ${POSTGRES_USER:-alertmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alertmanager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alertmanager} -d ${POSTGRES_DB:-alertmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      ALERT_MANAGER_DATABASE_URL: postgresql://${POSTGRES_USER:-alertmanager}:${POSTGRES_PASSWORD:-alertmanager}@postgres:5432/${POSTGRES_DB:-alertmanager}
    ports:
      - "8000:8000"
      - "7754:7754"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
