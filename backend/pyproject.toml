[project]
name = "alert-rule-manager-backend"
version = "0.1.0"
description = "Alert Rule Manager backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "argon2-cffi>=23.1,<24",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
